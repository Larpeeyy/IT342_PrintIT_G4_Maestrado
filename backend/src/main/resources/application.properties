spring.application.name=backend
server.port=8080
spring.profiles.active=local
server.forward-headers-strategy=framework
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# Google blocks private IP redirect URIs. Set this to your current HTTPS ngrok URL
# while testing mobile OAuth, then add {url}/login/oauth2/code/google in Google Cloud.
printit.oauth.public-base-url=${PRINTIT_OAUTH_PUBLIC_BASE_URL:}
